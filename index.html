<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Certificate Verification</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
    .found { color: green; }
    .not-found { color: red; }
  </style>
</head>
<body>
  <h1>Certificate Verification</h1>
  <div id="result"></div>

  <script>
    const certificates = {
      "CERT001": { name: "Zwe Htet Shine", course: "Technology Management", year: 2025 },
    };

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (id && certificates[id]) {
      document.getElementById("result").innerHTML = `
        <p class="found">✅ Certificate Verified</p>
        <p><strong>Name:</strong> ${certificates[id].name}</p>
        <p><strong>Course:</strong> ${certificates[id].course}</p>
        <p><strong>Year:</strong> ${certificates[id].year}</p>
      `;
    } else {
      document.getElementById("result").innerHTML = `<p class="not-found">❌ Certificate not found</p>`;
    }
  </script>
</body>
</html>
