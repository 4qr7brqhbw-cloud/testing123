<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love, Shwe Khit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Courier New', monospace;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        .pixel-frame {
            background: #0c0c1d;
            border: 8px solid #ff6b8b;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(255, 107, 139, 0.5);
            margin: 0 auto 30px;
            position: relative;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        canvas {
            display: block;
            margin: 0 auto;
        }

        .message {
            background: rgba(12, 12, 29, 0.8);
            border: 4px solid #4cc9f0;
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(76, 201, 240, 0.5);
        }

        h1 {
            color: #ff6b8b;
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 107, 139, 0.7);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #e0e0e0;
        }

        .proposal {
            font-size: 2rem;
            color: #4cc9f0;
            margin: 25px 0;
            text-shadow: 0 0 10px rgba(76, 201, 240, 0.7);
            animation: pulse 2s infinite;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            background: #ff6b8b;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255, 107, 139, 0.5);
        }

        button:hover {
            background: #4cc9f0;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(76, 201, 240, 0.7);
        }

        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            color: #ff6b8b;
            opacity: 0;
            animation: float 6s linear infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 5s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .proposal { font-size: 1.5rem; }
            button { padding: 10px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div class="pixel-frame">
            <canvas id="pixelCanvas" width="600" height="400"></canvas>
        </div>
        
        <div class="message">
            <h1>For My Beautiful Shwe Khit</h1>
            <p>Every day with you feels like a beautiful dream</p>
            <p>Your smile lights up my world</p>
            <p>Your love completes my soul</p>
            
            <div class="proposal" id="proposalText">Will you make me the happiest person and marry me?</div>
            
            <div class="buttons">
                <button id="yesBtn">YES! Forever!</button>
                <button id="noBtn">...</button>
            </div>
        </div>
    </div>
    
    <div class="hearts" id="hearts"></div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size based on container
        function resizeCanvas() {
            const container = document.querySelector('.pixel-frame');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            drawScene();
        }
        
        // Draw the pixel art scene
        function drawScene() {
            // Clear canvas
            ctx.fillStyle = '#0c0c1d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw stars
            drawStars();
            
            // Draw moon
            drawMoon();
            
            // Draw pixel art couple
            drawCouple();
            
            // Draw pixel art hearts
            drawHearts();
            
            // Draw ground
            drawGround();
        }
        
        function drawStars() {
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height * 0.7;
                const size = Math.random() * 2;
                ctx.fillRect(x, y, size, size);
            }
        }
        
        function drawMoon() {
            ctx.fillStyle = '#f5f5f5';
            ctx.beginPath();
            ctx.arc(canvas.width - 60, 60, 40, 0, Math.PI * 2);
            ctx.fill();
            
            // Moon craters
            ctx.fillStyle = '#e0e0e0';
            ctx.beginPath();
            ctx.arc(canvas.width - 75, 50, 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(canvas.width - 50, 70, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(canvas.width - 60, 40, 6, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawCouple() {
            const centerX = canvas.width / 2;
            const groundY = canvas.height - 50;
            
            // Person 1 (left)
            ctx.fillStyle = '#4cc9f0'; // Blue clothes
            // Body
            ctx.fillRect(centerX - 60, groundY - 80, 20, 40);
            // Head
            ctx.fillStyle = '#ffdbac';
            ctx.fillRect(centerX - 65, groundY - 110, 30, 30);
            
            // Person 2 (right)
            ctx.fillStyle = '#ff6b8b'; // Pink clothes
            // Body
            ctx.fillRect(centerX + 40, groundY - 80, 20, 40);
            // Head
            ctx.fillStyle = '#ffdbac';
            ctx.fillRect(centerX + 35, groundY - 110, 30, 30);
            
            // Hearts between them
            ctx.fillStyle = '#ff6b8b';
            drawPixelHeart(centerX - 10, groundY - 100, 12);
            drawPixelHeart(centerX, groundY - 90, 10);
            drawPixelHeart(centerX + 10, groundY - 110, 8);
        }
        
        function drawPixelHeart(x, y, size) {
            ctx.fillStyle = '#ff6b8b';
            // Simple pixel heart shape
            ctx.fillRect(x, y, size, size);
            ctx.fillRect(x + size, y, size, size);
            ctx.fillRect(x - size, y + size, size, size);
            ctx.fillRect(x, y + size, size, size);
            ctx.fillRect(x + size, y + size, size, size);
            ctx.fillRect(x, y + size * 2, size, size);
        }
        
        function drawHearts() {
            ctx.fillStyle = '#ff6b8b';
            for (let i = 0; i < 5; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height * 0.5;
                const size = 5 + Math.random() * 8;
                drawPixelHeart(x, y, size);
            }
        }
        
        function drawGround() {
            ctx.fillStyle = '#2d2d5c';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
            
            // Grass
            ctx.fillStyle = '#3a3a6b';
            for (let i = 0; i < canvas.width; i += 10) {
                ctx.fillRect(i, canvas.height - 50, 5, 10);
            }
        }
        
        // Create background stars
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 5 + 's';
                starsContainer.appendChild(star);
            }
        }
        
        // Create floating hearts
        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = '❤️';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                    heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                    heartsContainer.appendChild(heart);
                    
                    // Remove heart after animation
                    setTimeout(() => {
                        heart.remove();
                    }, 6000);
                }, i * 300);
            }
        }
        
        // Handle button clicks
        document.getElementById('yesBtn').addEventListener('click', function() {
            document.getElementById('proposalText').textContent = "You've made me the happiest person! I love you, Shwe Khit!";
            this.textContent = "I LOVE YOU!";
            document.getElementById('noBtn').style.display = 'none';
            
            // Create celebration effect
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    createHearts();
                }, i * 100);
            }
        });
        
        document.getElementById('noBtn').addEventListener('mouseover', function() {
            // Move the button away when hovered
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            this.style.position = 'fixed';
            this.style.left = x + 'px';
            this.style.top = y + 'px';
        });
        
        // Initialize
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        createStars();
        setInterval(createHearts, 2000);
        
        // Animate the pixel scene
        let frame = 0;
        function animate() {
            frame++;
            
            // Make hearts float up and down
            if (frame % 60 === 0) {
                drawScene();
            }
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
