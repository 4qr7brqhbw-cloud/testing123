<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Love, Shwe Khit</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #0c0e2b, #1a1f4b, #2d1b69);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        
        #animation-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 600px;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 2s;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.7);
        }
        
        p {
            font-size: 1.5em;
            margin: 10px 0;
        }
        
        #proposal {
            font-size: 2.5em;
            color: #ff69b4;
            margin-top: 30px;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9);
        }
        
        #response-buttons {
            margin-top: 30px;
            opacity: 0;
            transition: opacity 2s;
        }
        
        button {
            background: rgba(255, 105, 180, 0.7);
            border: none;
            color: white;
            padding: 15px 30px;
            margin: 0 15px;
            font-size: 1.2em;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: rgba(255, 105, 180, 1);
            transform: scale(1.1);
        }
        
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff69b4;
            transform: rotate(45deg);
            animation: float 6s infinite ease-in-out;
        }
        
        .heart:before, .heart:after {
            content: '';
            width: 20px;
            height: 20px;
            background: #ff69b4;
            border-radius: 50%;
            position: absolute;
        }
        
        .heart:before {
            top: -10px;
            left: 0;
        }
        
        .heart:after {
            top: 0;
            left: -10px;
        }
        
        @keyframes float {
            0%, 100% { transform: rotate(45deg) translateY(0); }
            50% { transform: rotate(45deg) translateY(-20px); }
        }
        
        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
            animation: explode 1.5s forwards;
        }
        
        @keyframes explode {
            0% { transform: translate(0, 0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="animation-container">
        <canvas id="main-canvas"></canvas>
        <div id="message">
            <h1>My Dearest Shwe Khit,</h1>
            <p>From the moment I met you, my life changed forever.</p>
            <p>You are the most beautiful person I know, inside and out.</p>
            <p>Every day with you is a blessing I cherish.</p>
            <p id="proposal">Will you marry me?</p>
            <div id="response-buttons">
                <button id="yes-btn">Yes, A Thousand Times Yes!</button>
                <button id="no-btn">...</button>
            </div>
        </div>
    </div>

    <script>
        // Get canvas and context
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const message = document.getElementById('message');
        const responseButtons = document.getElementById('response-buttons');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        
        // Set canvas dimensions
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        
        // Starfield animation
        const stars = [];
        const starCount = 200;
        
        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speed = Math.random() * 0.5;
                this.brightness = Math.random();
            }
            
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
                
                this.brightness = 0.5 + Math.sin(Date.now() * 0.001 + this.x) * 0.5;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.brightness})`;
                ctx.fill();
            }
        }
        
        // Create stars
        for (let i = 0; i < starCount; i++) {
            stars.push(new Star());
        }
        
        // Hearts animation
        const hearts = [];
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDelay = Math.random() * 5 + 's';
            heart.style.opacity = Math.random() * 0.5 + 0.5;
            document.body.appendChild(heart);
            
            hearts.push(heart);
            
            // Remove hearts after animation to prevent DOM overload
            setTimeout(() => {
                heart.remove();
                hearts.splice(hearts.indexOf(heart), 1);
            }, 6000);
        }
        
        // Create hearts periodically
        setInterval(createHeart, 500);
        
        // Fireworks
        function createFirework(x, y, color) {
            const particles = 50;
            for (let i = 0; i < particles; i++) {
                const angle = (Math.PI * 2 * i) / particles;
                const speed = 2 + Math.random() * 2;
                const tx = Math.cos(angle) * speed * 30;
                const ty = Math.sin(angle) * speed * 30;
                
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.left = x + 'px';
                firework.style.top = y + 'px';
                firework.style.background = color;
                firework.style.setProperty('--tx', tx + 'px');
                firework.style.setProperty('--ty', ty + 'px');
                
                document.getElementById('animation-container').appendChild(firework);
                
                setTimeout(() => {
                    firework.remove();
                }, 1500);
            }
        }
        
        // Animation sequence
        let animationPhase = 0;
        const animationTimer = setInterval(() => {
            animationPhase++;
            
            if (animationPhase === 3) {
                message.style.opacity = 1;
            }
            
            if (animationPhase === 6) {
                responseButtons.style.opacity = 1;
                clearInterval(animationTimer);
            }
        }, 2000);
        
        // Handle responses
        yesBtn.addEventListener('click', () => {
            message.innerHTML = '<h1>You\'ve Made Me The Happiest Person!</h1><p>I love you more than words can say, Shwe Khit!</p>';
            
            // Create celebration fireworks
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    createFirework(
                        Math.random() * canvas.width,
                        Math.random() * canvas.height,
                        `hsl(${Math.random() * 360}, 100%, 50%)`
                    );
                }, i * 300);
            }
            
            // Create more hearts
            for (let i = 0; i < 20; i++) {
                setTimeout(createHeart, i * 100);
            }
        });
        
        noBtn.addEventListener('mouseover', () => {
            // Move the no button away when hovered
            const container = document.getElementById('animation-container');
            const rect = container.getBoundingClientRect();
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = Math.random() * (rect.width - 200) + 'px';
            noBtn.style.top = Math.random() * (rect.height - 50) + 'px';
        });
        
        // Main animation loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw gradient background
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0c0e2b');
            gradient.addColorStop(0.5, '#1a1f4b');
            gradient.addColorStop(1, '#2d1b69');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw stars
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        // Start animation
        animate();
        
        // Add initial hearts
        for (let i = 0; i < 10; i++) {
            setTimeout(createHeart, i * 300);
        }
    </script>
</body>
</html>
