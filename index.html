<!DOCTYPE html>
<html>
<head>
    <title>Certificate Verification</title>
</head>
<body>
    <h1>Certificate Verification</h1>
    <div id="certificate-result"></div>

    <script>
        // Add your certificate verification logic here
        const certificates = {
            // Your certificate data goes here
        };
        
        // URL parameter reading logic
        const urlParams = new URLSearchParams(window.location.search);
        const certId = urlParams.get('id');
        
        // Display logic
        if (certId && certificates[certId]) {
            document.getElementById('certificate-result').innerHTML = 
                `Valid Certificate: ${certificates[certId].name}`;
        } else {
            document.getElementById('certificate-result').innerHTML = 
                'Certificate not found';
        }
    </script>
</body>
</html>
