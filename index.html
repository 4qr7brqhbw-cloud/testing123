<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            padding-top: 50px;
        }
        .container {
            background-color: white;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
        }
        h1 {
            color: #ff69b4;
        }
        button {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            opacity: 0.9;
        }
        #responseMessage {
            margin-top: 20px;
            font-size: 1.2em;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Dearest [Name],</h1>
        <p>From the moment I met you, my world became brighter.</p>
        <p>Every day spent with you is a treasure, and I can't imagine my future without you by my side.</p>
        <p>So, with all my heart, I ask you...</p>
        <h2>Will you marry me?</h2>
        <button onclick="displayResponse('Yes!')">Yes!</button>
        <button onclick="displayResponse('I need more time to think.')">Maybe...</button>
        <div id="responseMessage"></div>
    </div>

    <script>
        function displayResponse(answer) {
            const messageDiv = document.getElementById('responseMessage');
            if (answer === 'Yes!') {
                messageDiv.innerHTML = 'Oh my goodness! I am so incredibly happy! Thank you!';
                messageDiv.style.color = 'green';
            } else {
                messageDiv.innerHTML = 'I understand. Please take all the time you need. My feelings remain.';
                messageDiv.style.color = 'orange';
            }
        }
    </script>
</body>
</html>
